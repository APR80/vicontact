[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vicontact"
version = "0.1.0"
description = "Variational integrators for planar multibody systems with frictional contact"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "casadi",
    "matplotlib",
]

[tool.setuptools]
packages = ["vicontact"]
